version: '3.8'

services:
  evolution-redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.evolution
    command: /bin/sh -c 'redis-server --requirepass "$$EVOLUTION_REDIS_PASSWORD"'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$EVOLUTION_REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 3

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.evolution
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "apk add --no-cache ca-certificates && update-ca-certificates && . ./Docker/scripts/deploy_database.sh && npm run start:prod"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-redis:
        condition: service_healthy

volumes:
  evolution_redis_data:
  evolution_instances:
